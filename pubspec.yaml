name: cookjar
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.1.0
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.2
  logger: ^2.8.0
  lottie: ^3.5.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/lotties/
    - assets/audios/
    - .env


